<title>The Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{
  /* A room with the curtains open. The old palette was a night shift:
     ink walls, a desk lamp doing all the work, everything else falling
     away into the dark. This one is the same room at eleven in the
     morning, which means the page has to be paper first and the type
     has to carry in ink rather than in glow. */
  --sky:#dcebf7;
  --sky-2:#f4f9fd;
  --haze:#fdf6e8;
  --paper:#fffdf8;
  --paper-2:#f7f2e8;
  --ink:#243240;
  --ink-2:#465b6b;
  --muted:#6d8090;
  --dim:#9aaab6;
  --line:#e2e7e4;
  --line-2:#cfd8d4;

  --amber:#e08a1e;      /* sun on a wall            */
  --cyan:#2e86c8;       /* sky through the window   */
  --mint:#3f9e63;       /* stem and leaf            */
  --blueprint:#6a6fd0;  /* cornflower               */
  --petal:#e05a7d;      /* the flowers themselves   */

  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --gut:clamp(16px,4vw,34px);
  color-scheme:light;
}

/* Single committed visual world: a sunlit room. Painted explicitly so it
   holds on either host ground. */

html,body{height:100%}
body{
  margin:0;
  background:var(--sky-2);
  color:var(--ink);
  font-family:var(--body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(46,134,200,.34)}
a:hover{border-bottom-color:var(--cyan)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden}
#void{
  position:absolute;inset:0;
  background:
    radial-gradient(130% 100% at 74% 16%, #fff8e6 0%, #fdf1da 26%, #eaf3fb 58%, #d7e9f8 100%);
}
/* the warm cast the low sun throws across everything it does not touch */
#grid{
  position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(224,138,30,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(224,138,30,.055) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(62% 52% at 60% 40%,#000 0%,transparent 74%);
  mask-image:radial-gradient(62% 52% at 60% 40%,#000 0%,transparent 74%);
}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.dragging{cursor:grabbing}
#c.over{cursor:pointer}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 48% at 78% 14%, rgba(255,226,160,.55) 0%, rgba(255,226,160,0) 62%),
    radial-gradient(86% 76% at 46% 52%, transparent 52%, rgba(124,150,172,.22) 100%);
}

/* ---------- hud ---------- */
.hud{position:absolute;pointer-events:none;z-index:4}
.hud > *{pointer-events:auto}

#nameplate{
  top:calc(env(safe-area-inset-top,0px) + var(--gut));
  left:var(--gut);
  max-width:min(46vw,420px);
}
#nameplate .eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amber);margin:0 0 9px;
  display:flex;align-items:center;gap:8px;
}
#nameplate .eyebrow::before{
  content:"";width:18px;height:2px;background:var(--amber);opacity:.85;flex:none;border-radius:2px;
}
#nameplate h1{
  font-family:var(--display);font-weight:700;font-size:clamp(22px,3.1vw,34px);
  line-height:1.02;letter-spacing:-.022em;margin:0;text-wrap:balance;color:var(--ink);
}
#nameplate p{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.04em;
  color:var(--ink-2);margin:8px 0 0;line-height:1.45;
}

#compass{
  top:calc(env(safe-area-inset-top,0px) + var(--gut));
  right:var(--gut);
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
}
.chip-btn{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);
  padding:8px 13px;border:1px solid var(--line-2);border-radius:999px;
  background:rgba(255,253,248,.86);
  box-shadow:0 2px 0 rgba(36,50,64,.06);
  transition:color .18s,border-color .18s,background .18s,transform .12s;
}
.chip-btn:hover{color:var(--ink);border-color:var(--amber);background:#fff;transform:translateY(-1px)}
.chip-btn[hidden]{display:none}

#tray{
  left:var(--gut);right:var(--gut);
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--gut));
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
#legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#legend .lg{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
  padding:7px 12px;border:1px solid transparent;border-radius:999px;
  background:rgba(255,253,248,.78);
  box-shadow:0 2px 0 rgba(36,50,64,.05);
  transition:color .18s,border-color .18s,background .18s,transform .12s;
}
#legend .lg:hover{color:var(--ink);border-color:var(--line-2);background:#fff;transform:translateY(-1px)}
#legend .lg.on{color:#fff;border-color:transparent;background:var(--amber);box-shadow:0 2px 0 #b06a10}

#hint{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-align:right;line-height:1.7;white-space:nowrap;
}
#hint b{color:var(--ink);font-weight:700}

/* floating hover label, positioned by JS */
#tag{
  position:absolute;z-index:3;pointer-events:none;
  transform:translate(-50%,-140%);
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;white-space:nowrap;
  padding:6px 11px;border:1px solid var(--line-2);border-radius:999px;
  background:#fff;color:var(--ink);
  box-shadow:0 4px 14px rgba(36,50,64,.14);
  opacity:0;transition:opacity .14s;
}
#tag.on{opacity:1}
#tag i{color:var(--amber);font-style:normal;margin-right:7px}

/* ---------- panel ---------- */
#panel{
  position:absolute;z-index:6;
  top:0;right:0;height:100%;
  width:min(492px,42vw);
  display:flex;flex-direction:column;
  background:linear-gradient(200deg,#fffdf8 0%,#fdf8ef 56%,#f8f3e8 100%);
  border-left:1px solid var(--line-2);
  box-shadow:-30px 0 70px rgba(80,104,124,.16);
  transform:translateX(102%);
  transition:transform .46s cubic-bezier(.22,.9,.28,1);
  will-change:transform;
}
#panel.open{transform:translateX(0)}
#panel::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--amber) 0%,var(--petal) 38%,var(--mint) 72%,var(--cyan) 100%);
}
#pbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 26px 16px;
  border-bottom:1px solid var(--line);
}
#pback{
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);transition:color .18s;
}
#pback:hover{color:var(--amber)}
#pback span{font-size:13px;line-height:1}
#pidx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);font-variant-numeric:tabular-nums}

#pbody{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:28px 26px calc(env(safe-area-inset-bottom,0px) + 40px);
  scrollbar-width:thin;scrollbar-color:#cfd8d4 transparent;
}
#pbody::-webkit-scrollbar{width:9px}
#pbody::-webkit-scrollbar-thumb{background:#cfd8d4;border:3px solid transparent;background-clip:content-box;border-radius:9px}

.p-kick{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amber);margin:0 0 12px;
}
.p-title{
  font-family:var(--display);font-weight:700;font-size:clamp(25px,2.7vw,33px);
  line-height:1.06;letter-spacing:-.024em;margin:0;text-wrap:balance;color:var(--ink);
}
.p-sub{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;
  color:var(--muted);margin:13px 0 0;line-height:1.6;
}
.p-status{
  display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid;
}
.p-status i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.p-status.live{color:#b06a10;border-color:rgba(224,138,30,.4);background:rgba(224,138,30,.12)}
.p-status.soon{color:#4a4fae;border-color:rgba(106,111,208,.36);background:rgba(106,111,208,.11)}
.p-status.idea{color:var(--ink-2);border-color:var(--line-2);background:var(--paper-2)}
.p-status.ship{color:#2f7d4c;border-color:rgba(63,158,99,.36);background:rgba(63,158,99,.12)}

.p-rule{height:1px;background:var(--line);margin:26px 0 0;border:0}

.p-block{margin:26px 0 0}
.p-block h3{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink);margin:0 0 10px;
}
.p-block p{
  font-family:var(--body);font-size:16px;line-height:1.66;color:var(--ink-2);
  margin:0;max-width:62ch;
}
.p-block p + p{margin-top:12px}
.p-lead p{font-size:17px;color:var(--ink)}

.p-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.p-list li{
  display:flex;gap:16px;align-items:baseline;
  padding:11px 0;border-top:1px solid var(--line);
}
.p-list li:first-child{border-top:0}
.p-list .k{
  flex:none;width:112px;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);line-height:1.7;
}
.p-list .v{
  font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--ink-2);
}

/* race results: event, distance, finish time. Times are the point, so they
   get tabular figures and sit hard right where the eye scans for them. */
.p-races{list-style:none;margin:0;padding:0}
.p-races li{
  display:grid;grid-template-columns:1fr auto auto;gap:10px 14px;align-items:baseline;
  padding:11px 0;border-top:1px solid var(--line);
}
.p-races li:first-child{border-top:0}
.p-races .ev{font-family:var(--body);font-size:15.5px;color:var(--ink);line-height:1.4}
.p-races .di{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.p-races .ti{
  font-family:var(--mono);font-size:14px;font-weight:700;color:#b06a10;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 0}
.p-tags span{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);
  padding:5px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);
}

.p-links{display:flex;flex-direction:column;gap:0;margin:22px 0 0}
.p-links a{
  display:flex;align-items:baseline;gap:14px;padding:13px 0;
  border-top:1px solid var(--line);border-bottom:0;
  color:var(--ink);transition:color .18s;
}
.p-links a:first-child{border-top:0}
.p-links a:hover{color:var(--cyan)}
.p-links .k{
  flex:none;width:112px;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
.p-links .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}

.p-next{
  display:flex;gap:8px;flex-wrap:wrap;margin:34px 0 0;
  padding-top:22px;border-top:1px solid var(--line);
}
.p-next button{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 13px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--paper);box-shadow:0 2px 0 rgba(36,50,64,.05);
  transition:color .18s,border-color .18s,transform .12s;
}
.p-next button:hover{color:var(--amber);border-color:var(--amber);transform:translateY(-1px)}

/* ---------- loader ---------- */
#boot{
  position:absolute;inset:0;z-index:9;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:radial-gradient(120% 90% at 70% 20%, #fff8e6 0%, #f3f8fc 60%, #e6f0f9 100%);
  transition:opacity .6s;
}
#boot.gone{opacity:0;pointer-events:none}
#boot .bt{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);
}
#boot .bb{width:132px;height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
#boot .bb i{
  position:absolute;inset:0;width:40%;background:var(--amber);border-radius:3px;
  animation:sweep 1.15s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

/* ---------- static fallback ---------- */
#flat{display:none}
body.flat{overflow:auto;background:var(--sky-2)}
body.flat #stage{position:static;display:none}
body.flat #flat{display:block}

#flat .doc{max-width:74ch;margin:0 auto;padding-block:clamp(44px,8vw,86px);padding-left:var(--gut);padding-right:var(--gut)}
#flat .eyebrow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
#flat h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,58px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance;color:var(--ink)}
#flat .role{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted);margin:14px 0 0}
#flat .lede{font-family:var(--body);font-size:19px;line-height:1.6;color:var(--ink);margin:26px 0 0;max-width:60ch}
#flat h2{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--amber);margin:64px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line-2);
}
#flat h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;margin:32px 0 0;line-height:1.16;color:var(--ink)}
#flat .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin:8px 0 0;letter-spacing:.03em}
#flat h4{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);margin:22px 0 8px}
#flat p{font-family:var(--body);font-size:16px;line-height:1.66;color:var(--ink-2);margin:10px 0 0;max-width:62ch}
#flat .note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:52px;line-height:1.8}
#flat dl{margin:14px 0 0;display:flex;flex-direction:column;gap:0}
#flat dl div{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
#flat dt{flex:none;width:112px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#flat dd{margin:0;font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--ink-2);flex:1;min-width:180px}

@media (max-width:860px){
  #panel{
    top:auto;bottom:0;right:0;left:0;width:auto;height:auto;
    max-height:72%;
    border-left:0;border-top:1px solid var(--line-2);
    border-radius:18px 18px 0 0;
    transform:translateY(102%);
    box-shadow:0 -24px 60px rgba(80,104,124,.2);
  }
  #panel.open{transform:translateY(0)}
  #panel::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px;border-radius:18px 18px 0 0;
    background:linear-gradient(90deg,var(--amber) 0%,var(--petal) 38%,var(--mint) 72%,var(--cyan) 100%)}
  #pbar{padding:16px 20px 13px}
  #pbody{padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
  #nameplate{max-width:min(70vw,340px)}
  #hint{display:none}
  #tray{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;right:14px}
  #legend{gap:5px}
  .p-list .k,.p-links .k{width:88px}
}
@media (max-width:520px){
  #legend .lg{padding:6px 10px;font-size:9px;letter-spacing:.08em}
  #nameplate h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  #panel{transition:none}
  #boot .bb i{animation:none;width:100%}
  *{scroll-behavior:auto}
}
</style>

<div id="stage">
  <div id="void"></div>
  <div id="grid"></div>
  <canvas id="c"></canvas>
  <div id="vignette"></div>

  <div id="tag"><i id="tagk"></i><span id="tagv"></span></div>

  <div class="hud" id="nameplate">
    <p class="eyebrow">The Workshop</p>
    <h1>Sanzhar Yermek</h1>
    <p>Full-Stack Engineer &amp; AI Systems Architect<br>Astana, Kazakhstan</p>
  </div>

  <div class="hud" id="compass">
    <button class="chip-btn" id="reset" hidden>Reset view</button>
  </div>

  <div class="hud" id="tray">
    <div id="legend"></div>
    <div id="hint"><b>Drag</b> to orbit &nbsp;·&nbsp; <b>Scroll</b> to zoom<br><b>Click</b> anything on the desk</div>
  </div>

  <aside id="panel" aria-hidden="true" aria-live="polite">
    <div id="pbar">
      <button id="pback"><span>&larr;</span> Back to the room</button>
      <div id="pidx"></div>
    </div>
    <div id="pbody"></div>
  </aside>

  <div id="boot">
    <div class="bt">Opening the workshop</div>
    <div class="bb"><i></i></div>
  </div>
</div>

<main id="flat"><div class="doc" id="flatdoc"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  { p:[0.00, 2.58, -3.70], c:[0.36, 0.72, 0.96], i:0.55, a:0.46, b:0.40 },
  /* the gear wall faces away from the window, so it keeps its own light */
  { p:[-4.08, 4.48, 2.50], c:[1.00, 0.92, 0.80], i:1.15, a:0.44, b:0.28 },

var SKY = [0.315, 0.352, 0.420];   // open sky overhead
var GND = [0.235, 0.190, 0.138];   // warm bounce off a pale oak floor

/* ------------------------------------------------------------
   BUILDER
   Accumulates transformed, pre-shaded triangles into flat arrays.
   Normals are consumed during the bake and then thrown away: with
   MeshBasicMaterial nothing downstream needs them, so each vertex
   ships 6 floats instead of 9.
   ------------------------------------------------------------ */

/* Curve and texture resolution, set once by the 3D layer as soon as it
   knows what machine it is on: 1 on the low tier, 2 everywhere else.
   Both are bake-time costs. A doubled segment count is paid once, into
   a merged buffer, and costs nothing per frame afterwards, so the round
   things can stop being faceted without touching the budget that
   actually matters. */
var QUAL = 1;

var _geoCache = {};
function gBox(w, h, d){
  var k = 'b' + w + '_' + h + '_' + d;
  if (!_geoCache[k]) _geoCache[k] = new THREE.BoxGeometry(w, h, d);
  return _geoCache[k];
}
/* A box with its edges rolled off. Every edge in this room used to end
   in a perfectly sharp corner, which is the single thing that makes a
   box-built scene read as blocks rather than objects: a real edge always
   catches a highlight. Each face is subdivided once and its border
   vertices are projected onto the rounded shell, so neighbouring faces
   land on exactly the same points and no seam opens up. Smooth normals
   across that border give the rolloff. Four times the triangles of a
   plain box, all of it paid once into the merged buffer. */
function gCBox(w, h, d){
  var k = 'x' + w + '_' + h + '_' + d;
  if (_geoCache[k]) return _geoCache[k];
  var r = Math.min(w, h, d) * 0.20;
  if (r > 0.026) r = 0.026;
  if (r < 0.0016) return (_geoCache[k] = gBox(w, h, d));

  var g = new THREE.BoxGeometry(w, h, d, 2, 2, 2);
  var p = g.attributes.position, i, vx, vy, vz, cx, cy, cz, dx, dy, dz, L;

    cx = vx < -hx ? -hx : (vx > hx ? hx : vx);
    cy = vy < -hy ? -hy : (vy > hy ? hy : vy);
    cz = vz < -hz ? -hz : (vz > hz ? hz : vz);
    dx = vx - cx; dy = vy - cy; dz = vz - cz;
    L = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (L > 1e-9){ dx = dx / L * r; dy = dy / L * r; dz = dz / L * r; }
    p.setXYZ(i, cx + dx, cy + dy, cz + dz);
  }
  g.computeVertexNormals();
  return (_geoCache[k] = g);
}

function gCyl(rt, rb, h, seg, open){

  var k = 'c' + rt + '_' + rb + '_' + h + '_' + seg + '_' + (open ? 1 : 0);
  if (!_geoCache[k]) _geoCache[k] = new THREE.CylinderGeometry(rt, rb, h, seg, 1, !!open);

}
function gSphere(r, seg){
  seg = Math.round((seg || 8) * QUAL);
  var k = 's' + r + '_' + seg;
  if (!_geoCache[k]) _geoCache[k] = new THREE.SphereGeometry(r, seg, Math.max(3, seg >> 1));
  return _geoCache[k];
}
function gPlane(w, h){
  var k = 'p' + w + '_' + h;
  if (!_geoCache[k]) _geoCache[k] = new THREE.PlaneGeometry(w, h);
  return _geoCache[k];

function gTorus(r, t, rs, ts){
  rs = Math.round((rs || 5) * QUAL); ts = Math.round((ts || 16) * QUAL);
  var k = 't' + r + '_' + t + '_' + rs + '_' + ts;
  if (!_geoCache[k]) _geoCache[k] = new THREE.TorusGeometry(r, t, rs, ts);
  return _geoCache[k];

function gRing(ri, ro, seg){
  seg = Math.round((seg || 20) * QUAL);
  var k = 'r' + ri + '_' + ro + '_' + seg;
  if (!_geoCache[k]) _geoCache[k] = new THREE.RingGeometry(ri, ro, seg);
  return _geoCache[k];
}

var _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(),
    _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1);

  _q.setFromEuler(_e);
  _p.set(x, y, z);

/* the same with a scale, so one sphere can become a helmet shell, a

function xfs(x, y, z, rx, ry, rz, sx, sy, sz){
  _e.set(rx||0, ry||0, rz||0, 'YXZ');
  _q.setFromEuler(_e);
  _p.set(x, y, z);
  return new THREE.Matrix4().compose(_p, _q,

/* Lets an object be authored in convenient local coordinates and then placed

Builder.prototype.setBase = function(m){ this.baseM = m; return this; };

Builder.prototype.push = function(geo, mat, colorHex, opt){

    this.pos.push(P[i], P[i+1], P[i+2]);

/* box(w,h,d, x,y,z, colour, [rotY | [rx,ry,rz]], opt) */
Builder.prototype.box = function(w, h, d, x, y, z, col, rot, opt){

/* ---- decals ----------------------------------------------------------
   Wordmarks and logos on a transparent canvas. At the distance the
   camera frames these objects from, a shape alone reads as "a bike";
   the wordmark is what makes it read as a specific bike.            */

function texWord(text, w, h, col, size, italic, track){
  var c = cv(w, h), x = c.getContext('2d');
  x.clearRect(0, 0, w, h);
  x.fillStyle = col;
  x.font = (italic ? 'italic ' : '') + 'bold ' + size + 'px Arial, Helvetica, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  if (track){
    /* manual letter-spacing: canvas has no letterSpacing in old browsers */
    var tot = 0, i;
    for (i = 0; i < text.length; i++) tot += x.measureText(text[i]).width + track;
    var px = (w - tot + track) / 2;
    x.textAlign = 'left';
    for (i = 0; i < text.length; i++){
      x.fillText(text[i], px, h / 2);
      px += x.measureText(text[i]).width + track;
    }
  } else {
    x.fillText(text, w / 2, h / 2);
  }
  return tex(c);
}

/* one flower: a stem, a leaf and a bloom made of six flattened petals
   round a centre, which is the least geometry that still reads as a
   flower and not as a coloured ball on a stick */
function flower(b, x, y, z, h, lean, spin, petal, heart, r){
  r = r || 0.072;
  var dx = Math.sin(lean) * Math.cos(spin) * h;
  var dz = Math.sin(lean) * Math.sin(spin) * h;
  var dy = Math.cos(lean) * h;
  b.box(0.017, h, 0.017, x + dx/2, y + dy/2, z + dz/2, C.stem,
        [Math.sin(spin) * lean, 0, -Math.cos(spin) * lean]);
  var hx = x + dx, hy = y + dy, hz = z + dz, p, a;
  for (p = 0; p < 6; p++){
    a = p * Math.PI / 3 + spin;
    b.push(gSphere(1, 6), xfs(hx + Math.cos(a) * r * 0.86, hy, hz + Math.sin(a) * r * 0.86,
                              0, -a, 0, r * 0.80, r * 0.30, r * 0.50), petal);
  }
  b.push(gSphere(1, 7), xfs(hx, hy + 0.014, hz, 0, 0, 0,
                            r * 0.44, r * 0.30, r * 0.44), heart);
  b.push(gSphere(1, 5), xfs(x + dx * 0.42 + 0.055, y + dy * 0.42, z + dz * 0.42,
                            0, spin + 0.9, 0.55, 0.070, 0.011, 0.032), C.leaf);
}

function decal(t, w, h, x, y, z, rx, ry, rz){
  var m = new THREE.Mesh(gPlane(w, h), new THREE.MeshBasicMaterial({
    map: t, transparent: true, depthWrite: false
  }));
  m.position.set(x, y, z);
  m.rotation.set(rx || 0, ry || 0, rz || 0, 'YXZ');
  m.renderOrder = 2;
  return m;
}

var C = {

var GLOW = {

  cyan:[0.36,0.78,0.98], mint:[0.44,0.92,0.74], red:[0.95,0.34,0.30]

/* The gear corner's shared layout. The rail and its pegs are furniture,
   so the room builds them; everything that hangs off them is built by the
   hotspots further down, and the two have to agree about where they are. */
var GEAR = {
  railX: -4.415, railY: 2.10, railZ0: 0.90, railZ1: 4.05,
  peg: { medal: 1.20, helmet: 1.70, goggles: 2.08, cap: 2.34, suit: 2.62,
         wet: 3.18, towel: 3.80 }

function buildRoom(){
  var b = new Builder(), i, a;

  /* ---- shell ---- */
  b.box(10, 0.50, 10, 0, -0.25, 0, C.floor);
  b.box(4.8, 0.02, 2.9, -0.30, 0.012, -1.45, C.rug);
  b.box(10, 5.2, 0.30, 0, 2.60, -4.65, C.wall);
  b.box(0.30, 5.2, 10, -4.65, 2.60, 0, C.wallL);
  b.box(10, 0.24, 0.07, 0, 0.12, -4.46, C.skirt);
  b.box(0.07, 0.24, 10, -4.46, 0.12, 0, C.skirt);

  /* vertical battens give both walls a readable surface grain */
  for (i = 0; i < 8; i++){
    b.box(0.07, 5.2, 0.05, -4.2 + i*1.2, 2.60, -4.47, C.batten);
    b.box(0.05, 5.2, 0.07, -4.47, 2.60, -4.2 + i*1.2, C.batten);
  }

  /* ---- desk ---- */
  b.box(5.8, 0.12, 1.80, 0, 1.48, -3.50, C.desk);
  b.box(5.8, 0.06, 0.06, 0, 1.39, -2.62, C.deskDark);
  b.box(0.12, 1.42, 1.70, -2.85, 0.71, -3.50, C.deskDark);
  b.box(0.12, 1.42, 1.70,  2.85, 0.71, -3.50, C.deskDark);
  b.box(5.60, 0.10, 0.10, 0, 0.42, -4.15, C.deskDark);

  /* drawer pedestal */
  b.box(0.95, 1.26, 1.55, -2.00, 0.63, -3.50, C.drawer);
  for (i = 0; i < 3; i++){
    b.box(0.88, 0.34, 0.04, -2.00, 1.08 - i*0.38, -2.70, C.drawerF);
    b.cyl(0.02, 0.02, 0.26, 6, -2.00, 1.08 - i*0.38, -2.66, C.metal, [0, 0, Math.PI/2]);
  }

  /* mini tower under the desk, two status LEDs */
  b.box(0.44, 0.72, 0.62, 2.25, 0.36, -3.85, C.case);
  for (i = 0; i < 5; i++) b.box(0.30, 0.025, 0.02, 2.25, 0.60 - i*0.07, -3.53, 0x14181f);
  b.box(0.05, 0.05, 0.02, 2.12, 0.66, -3.53, 0x7fe0b8, 0, { glow: GLOW.mint, glowI: 0.55 });

<script>
/* ============================================================
   UI LAYER
   Panel rendering, the legend, and the no-WebGL document.
   Knows nothing about Three.js: the 3D layer registers a focus
   handler on it, and everything still works if that never happens.
   ============================================================ */

var UI = (function(){

  var panel  = document.getElementById('panel');
  var pbody  = document.getElementById('pbody');
  var pidx   = document.getElementById('pidx');
  var pback  = document.getElementById('pback');
  var legend = document.getElementById('legend');
  var resetB = document.getElementById('reset');

  var current = null;
  var onFocus = null;   /* set by the 3D layer */
  var onClear = null;

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function rows(items, hl){
    var h = '<ul class="p-list">';
    for (var i = 0; i < items.length; i++){
      var on = hl && items[i][2] === hl;
      h += '<li><span class="k"' + (on ? ' style="color:#ffb45c"' : '') + '>' + esc(items[i][0]) +
           '</span><span class="v">' + esc(items[i][1]) + '</span></li>';
    }
    return h + '</ul>';
  }

  function render(id, hl){
    var d = CONTENT[id];
    if (!d) return '';
    var h = '', i;

    h += '<p class="p-kick">' + esc(d.kicker) + '</p>';
    h += '<h2 class="p-title">' + esc(d.title) + '</h2>';
    if (d.sub) h += '<p class="p-sub">' + esc(d.sub) + '</p>';
    if (d.status) h += '<div><span class="p-status ' + d.status[0] + '"><i></i>' + esc(d.status[1]) + '</span></div>';
    h += '<hr class="p-rule">';

    if (d.lead) h += '<div class="p-block p-lead"><p>' + esc(d.lead) + '</p></div>';

    if (d.blocks){
      for (i = 0; i < d.blocks.length; i++){
        h += '<div class="p-block">';
        if (d.blocks[i].h) h += '<h3>' + esc(d.blocks[i].h) + '</h3>';
        h += '<p>' + esc(d.blocks[i].p) + '</p></div>';
      }
    }

    if (d.groups){
      var gr = [];
      for (i = 0; i < d.groups.length; i++) gr.push([d.groups[i].h, d.groups[i].v, d.groups[i].id]);
      h += '<div class="p-block">' + rows(gr, hl) + '</div>';
    }

    if (d.facts) h += '<div class="p-block"><h3>By the numbers</h3>' + rows(d.facts) + '</div>';

    if (d.races){
      h += '<div class="p-block"><h3>Race results</h3><ul class="p-races">';
      for (i = 0; i < d.races.length; i++){
        h += '<li><span class="ev">' + esc(d.races[i][0]) + '</span>' +
             '<span class="di">' + esc(d.races[i][1]) + '</span>' +
             '<span class="ti">' + esc(d.races[i][2]) + '</span></li>';
      }
      h += '</ul></div>';
    }

    if (d.links){
      h += '<div class="p-links">';
      for (i = 0; i < d.links.length; i++){
        h += '<a href="' + esc(d.links[i][2]) + '"' +
             (d.links[i][2].indexOf('mailto:') === 0 ? '' : ' target="_blank" rel="noopener"') + '>' +
             '<span class="k">' + esc(d.links[i][0]) + '</span>' +
             '<span class="v">' + esc(d.links[i][1]) + '</span></a>';
      }
      h += '</div>';
    }

    if (d.tags){
      h += '<div class="p-tags">';
      for (i = 0; i < d.tags.length; i++) h += '<span>' + esc(d.tags[i]) + '</span>';
      h += '</div>';
    }

    if (d.next){
      h += '<div class="p-next">';
      for (i = 0; i < d.next.length; i++){
        var n = CONTENT[d.next[i]];
        if (n) h += '<button data-go="' + d.next[i] + '">' + esc(n.title) + ' &rarr;</button>';
      }
      h += '</div>';
    }
    return h;
  }

  function open(id, hl){
    if (!CONTENT[id]) return;
    current = id;
    pbody.innerHTML = render(id, hl);
    pbody.scrollTop = 0;
    var n = ORDER.indexOf(id);
    pidx.textContent = n >= 0 ? (n + 1 < 10 ? '0' : '') + (n + 1) + ' / ' + ORDER.length : '';
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    resetB.hidden = false;
    markLegend(id);
  }

  function close(){
    current = null;
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    resetB.hidden = true;
    markLegend(null);
    if (onClear) onClear();
  }

  function markLegend(id){
    var kids = legend.children;
    for (var i = 0; i < kids.length; i++){
      var on = !!id && kids[i].getAttribute('data-go') === id;
      if (on) kids[i].classList.add('on'); else kids[i].classList.remove('on');
    }
  }

  function go(id, hl){
    if (onFocus) onFocus(id, hl);
    else open(id, hl);
  }

  function hit(e){
    var n = e.target;
    while (n && n !== document){
      if (n.getAttribute && n.getAttribute('data-go')) return n;
      n = n.parentNode;
    }
    return null;
  }

  (function(){
    var h = '';
    for (var i = 0; i < LEGEND.length; i++){
      h += '<button class="lg" data-go="' + LEGEND[i][0] + '">' + esc(LEGEND[i][1]) + '</button>';
    }
    legend.innerHTML = h;
  })();

  legend.addEventListener('click', function(e){ var t = hit(e); if (t) go(t.getAttribute('data-go')); });
  pbody.addEventListener('click',  function(e){ var t = hit(e); if (t) go(t.getAttribute('data-go')); });
  pback.addEventListener('click', close);
  resetB.addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if ((e.key === 'Escape' || e.keyCode === 27) && current) close();
  });

  /* ---- the document the room falls back to ---- */
  function buildFlat(){
    var d = document.getElementById('flatdoc'), a = CONTENT.about, i, j, h = '';

    h += '<p class="eyebrow">Portfolio</p><h1>' + esc(a.title) + '</h1>';
    h += '<p class="role">' + esc(a.sub) + '</p>';
    h += '<p class="lede">' + esc(a.lead) + '</p>';

    h += '<h2>About</h2>';
    for (i = 0; i < a.blocks.length; i++) h += '<p>' + esc(a.blocks[i].p) + '</p>';

    h += '<h2>Experience</h2>';
    var ex = ['exp_ai', 'exp_data', 'exp_snoonu'];
    for (i = 0; i < ex.length; i++){
      var e = CONTENT[ex[i]];
      h += '<h3>' + esc(e.title) + '</h3><p class="meta">' + esc(e.sub) + '</p>';
      for (j = 0; j < e.blocks.length; j++){
        if (e.blocks[j].h) h += '<h4>' + esc(e.blocks[j].h) + '</h4>';
        h += '<p>' + esc(e.blocks[j].p) + '</p>';
      }
    }

    h += '<h2>Independent &amp; Exploratory Projects</h2>';
    var pr = ['proj_konsul','proj_voice','proj_bank','proj_tanba','proj_speech','proj_segue','proj_terra'];
    for (i = 0; i < pr.length; i++){
      var p = CONTENT[pr[i]];
      h += '<h3>' + esc(p.title) + '</h3><p class="meta">' + esc(p.sub) +
           (p.status ? ' &nbsp;&middot;&nbsp; ' + esc(p.status[1]) : '') + '</p>';
      h += '<p>' + esc(p.blocks[0].p) + '</p>';
    }

    h += '<h2>Technical Skills</h2><dl>';
    for (i = 0; i < CONTENT.skills.groups.length; i++){
      var g = CONTENT.skills.groups[i];
      h += '<div><dt>' + esc(g.h) + '</dt><dd>' + esc(g.v) + '</dd></div>';
    }
    h += '</dl>';

    h += '<h2>Education</h2><h3>' + esc(CONTENT.education.title) + '</h3>';
    h += '<p class="meta">' + esc(CONTENT.education.sub) + '</p>';

    var sp = CONTENT.sports;
    h += '<h2>Endurance Sports</h2>';
    h += '<p>' + esc(sp.blocks[0].p) + '</p>';
    h += '<h4>Gear</h4><dl>';
    for (i = 0; i < sp.groups.length; i++){
      h += '<div><dt>' + esc(sp.groups[i].h) + '</dt><dd>' + esc(sp.groups[i].v) + '</dd></div>';
    }
    h += '</dl><h4>Race results</h4><dl>';
    for (i = 0; i < sp.races.length; i++){
      h += '<div><dt>' + esc(sp.races[i][1]) + '</dt><dd>' + esc(sp.races[i][0]) +
           ' &nbsp;&middot;&nbsp; ' + esc(sp.races[i][2]) + '</dd></div>';
    }
    for (i = 0; i < sp.links.length; i++){
      h += '<div><dt>' + esc(sp.links[i][0]) + '</dt><dd><a href="' + esc(sp.links[i][2]) +
           '" target="_blank" rel="noopener">' + esc(sp.links[i][1]) + '</a></dd></div>';
    }
    h += '</dl>';

    h += '<h2>Contact</h2><dl>';
    for (i = 0; i < CONTENT.contact.links.length; i++){
      var L = CONTENT.contact.links[i];

   Sniffed on a throwaway context, before the real renderer exists,
   because the answer decides whether that renderer may ask for
   multisampling, which cannot be turned on afterwards. Everything here
   degrades detail, never layout: a low-tier machine sees the same room,
   lit the same way, with coarser curves and a smaller buffer.       */
var LOW = false;
try {
  var probe = document.createElement('canvas');
  var pg = probe.getContext('webgl') || probe.getContext('experimental-webgl');
  if (pg){
    var dbg = pg.getExtension('WEBGL_debug_renderer_info');
    if (dbg){
      var rend = String(pg.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
      /* software rasterisers and pre-2010 Intel parts */
      if (/SwiftShader|llvmpipe|Mesa DRI|Microsoft Basic|Gallium|\bGMA\b|945G[MC]?\b|950GM|X3100/i.test(rend)) LOW = true;
      /* First-generation Intel HD, 2010 to 2011: "HD Graphics" bare, or
         2000/2500/3000. Match the model explicitly rather than the family
         name, because every UHD and Iris part, and every HD 4000 and up,
         runs this scene at full resolution and has no business being
         dropped to the low tier. \b before HD is what keeps UHD out. */
      var hd = rend.match(/\bHD Graphics\s*(\d{3,4})?/i);
      if (hd && !/\bUHD\b|\bIris\b/i.test(rend)){
        var mod = hd[1] ? +hd[1] : 0;
        if (!mod || mod === 2000 || mod === 2500 || mod === 3000) LOW = true;
      }

    var lose = pg.getExtension('WEBGL_lose_context');

  /* A group spread from the floor to head height frames badly on its own
     bounding box: the centre lands between the things you came to look
     at. opt.center names the subject instead. */
  if (opt && opt.center) c.set(opt.center[0], opt.center[1], opt.center[2]);

  var s = {
    id: id, label: label, hl: hl || null, group: g, center: c,
    t: view[0] * DEG, p: view[1] * DEG, r: view[2],
    mats: [], pulse: [], lit: 0
  };
  g.traverse(function(o){
    if (!o.material) return;
    o.userData.spot = s;
    if (o.userData.pulse) s.pulse.push(o.material);
    else s.mats.push({ m: o.material, c: o.material.color.clone() });
  });

  if (!SPOTBY[id]) SPOTBY[id] = s;

   The sun is the whole point of this room now, so it gets geometry: the
   sky in the opening, the beam that comes through it, and the patch of
   floor the beam lands on. All three are additive and none of them write
   depth, so the desk and the chair cut into the beam exactly as they

var glowTex = radialTex('rgba(255,244,214,0.95)', 'rgba(255,214,140,0.34)', 64);

  var L = LIGHTS[0].p;
  var d = [ (WIN.x0 + WIN.x1) / 2 - L[0], (WIN.y0 + WIN.y1) / 2 - L[1], WIN.z - L[2] ];
  var m = Math.sqrt(d[0]*d[0] + d[1]*d[1] + d[2]*d[2]);
  return [d[0]/m, d[1]/m, d[2]/m];
})();

function toFloor(x, y){
  var t = y / -SUN[1];
  return [x + SUN[0] * t, 0.040, WIN.z + SUN[2] * t];

(function(){

     shaft texture thins the beam out as it crosses the room */

/* ------------------------------------------------------------
   THE BIKE MODEL
   The only asset this page fetches. Everything else in the room is
   generated at run time, and that works for a desk, a chair, a pair of
   shoes. It does not work for a bicycle: the shape is almost entirely
   thin members and negative space, the eye knows it far too well to
   accept an approximation, and every generated version of it read as a
   toy.

   So the bike is a real mesh, and the generated one stays behind it as
   the fallback. The model is asked for only once the room is already on
   screen and interactive, only on the full tier, and only if it is
   actually there: the loader script is not even requested otherwise,
   and a failure anywhere along the way leaves the generated bike
   exactly where it is. Nothing waits for it.

   Its own materials are dropped on arrival. This room is lit once into
   vertex colours and rendered flat, so a PBR pipeline would match
   nothing around it. Each part keeps the base colour its material asked
   for and joins the room's lighting instead.
   ------------------------------------------------------------ */

var MODEL = {
  url: 'bike.glb',
  loader: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js',
  len: 3.34,        /* the model is scaled until it is this long     */
  turn: 0,          /* turned until the drive side faces the room    */
  lean: 0.02
};

function loadBike(fallback){
  if (LOW || REDUCED) return;
  fetch(MODEL.url, { method: 'HEAD' }).then(function(r){
    if (!r.ok) return;
    var sc = document.createElement('script');
    sc.src = MODEL.loader;
    sc.onload = function(){
      if (!THREE.GLTFLoader) return;
      new THREE.GLTFLoader().load(MODEL.url, function(gltf){
        fitBike(gltf.scene, fallback);
      }, null, function(){});
    };
    document.head.appendChild(sc);
  })['catch'](function(){});
}

function fitBike(root, fallback){
  /* fitted to the model's own bounds rather than to numbers copied out
     of it, so a different bike drops in without a value changing here */
  var bx = new THREE.Box3().setFromObject(root), sz = new THREE.Vector3();
  bx.getSize(sz);
  root.scale.setScalar(MODEL.len / Math.max(sz.x, sz.z));
  root.rotation.set(0, MODEL.turn, MODEL.lean, 'YXZ');
  root.updateMatrixWorld(true);
  bx.setFromObject(root);
  var c = new THREE.Vector3(); bx.getCenter(c);
  root.position.set(BIKE.x - c.x, BIKE.y - bx.min.y, BIKE.z - c.z);

  var sp = fallback.userData.spot;
  root.traverse(function(o){
    if (!o.isMesh) return;
    var src = o.material;
    var col = src && src.color ? src.color.clone() : new THREE.Color(0x262b33);
    col.multiplyScalar(0.40);
    o.material = new THREE.MeshPhongMaterial({
      color: col, shininess: 28, specular: 0x5f6a79
    });
    o.userData.spot = sp;
    if (sp) sp.mats.push({ m: o.material, c: o.material.color.clone() });
  });

  fallback.visible = false;
  fallback.parent.add(root);
  need = true;
}

/* ------------------------------------------------------------
   THE GEAR CORNER
   The bike hangs off the left wall on two rim hooks, which is where
   a road bike actually lives in a flat and which clears the floor
   for everything else. It is authored side-on in local coordinates
   (long axis Z, frame in the YZ plane) and placed once with a base
   matrix, which is what setBase exists for. The rail underneath
   carries the swim and race kit; the floor carries what you step
   into on the way out of the door.
   ------------------------------------------------------------ */

var BIKE = { x: -4.14, y: 2.44, z: 2.50, lean: 0.02 };
var FRAME = 0x1e222a, CARBON = 0x282d36, RUBBER = 0x111316,
    ALLOY = 0x8b93a2, DECAL = 0xe4e9f2, ROTOR = 0x9aa3b2;

/* an aero tube between two points in the local YZ plane. The SL9's tubes
   are flattened sections, not round, so a box is both simpler and truer. */
function bar(b, ay, az, by, bz, w, th, col, xo){
  var dy = by - ay, dz = bz - az;
  var L = Math.sqrt(dy*dy + dz*dz);
  b.box(w, L, th, xo || 0, (ay+by)/2, (az+bz)/2, col, [Math.atan2(dz, dy), 0, 0]);
}

/* Roval Rapide CLX III: 51mm front, 60mm rear, so the rear rim face is
   the deeper annulus. The flat face is what reads as "deep carbon" from
   the side; the rotor is what dates the bike to the disc era. */
function wheel(b, cz, rear){
  var inner = rear ? 0.432 : 0.452;

  b.push(gTorus(0.600, 0.040, 5, 20), xf(0, 0.64, cz, 0, Math.PI/2, 0), RUBBER);
  b.push(gRing(0.572, 0.601, 22), xf(0, 0.64, cz, 0,  Math.PI/2, 0), 0x23272f);
  b.push(gRing(0.572, 0.601, 22), xf(0, 0.64, cz, 0, -Math.PI/2, 0), 0x23272f);
  b.push(gRing(inner, 0.578, 22), xf(0, 0.64, cz, 0,  Math.PI/2, 0), CARBON);
  b.push(gRing(inner, 0.578, 22), xf(0, 0.64, cz, 0, -Math.PI/2, 0), CARBON);
  b.push(gRing(0.552, 0.578, 22), xf(0, 0.64, cz, 0,  Math.PI/2, 0), 0x3a414e);
  b.push(gRing(0.552, 0.578, 22), xf(0, 0.64, cz, 0, -Math.PI/2, 0), 0x3a414e);

  b.cyl(0.058, 0.058, 0.13, 8, 0, 0.64, cz, ALLOY, [0, 0, Math.PI/2]);
  b.cyl(0.040, 0.040, 0.15, 8, 0, 0.64, cz, 0x2f3540, [0, 0, Math.PI/2]);
  for (var s = 0, ns = 6 * QUAL; s < ns; s++){
    b.box(0.007, 0.024, 0.92, 0, 0.64, cz, 0x333944, [s * Math.PI / ns, 0, 0]);
  }

  /* the valve: a two-millimetre detail that stops the rim reading as a disc */
  b.cyl(0.011, 0.011, 0.075, 5, 0, 1.175, cz, ALLOY);

  /* rotor and caliper sit on the non-drive side, seen through the open
     centre of the wheel from the drive side we are looking at */
  b.push(gRing(0.098, 0.196, 18), xf(-0.088, 0.64, cz, 0, -Math.PI/2, 0), ROTOR);
  b.push(gRing(0.098, 0.196, 18), xf(-0.088, 0.64, cz, 0,  Math.PI/2, 0), 0x767f8d);
  b.cyl(0.098, 0.098, 0.016, 10, -0.088, 0.64, cz, 0x5c6472, [0, 0, Math.PI/2]);
  b.box(0.055, 0.155, 0.075, -0.086, 0.64 + (rear ? 0.13 : 0.16),
        cz + (rear ? 0.20 : -0.19), 0x373d49);

  if (rear){
    /* the cassette, biggest sprocket inboard, on the drive side */
    for (var d = 0; d < 6; d++){
      var rr = 0.130 - d * 0.0155;
      b.cyl(rr, rr, 0.010, 10, 0.070 + d * 0.015, 0.64, cz, ALLOY, [0, 0, Math.PI/2]);
    }
  }
}

/* the wall hook each rim hangs in: plate, arm, and a rubber-sleeved U
   the tyre crown sits inside */
/* The hooks are placed off proportions that hold for any road bike
   rather than off this particular model: the hubs sit 29.3% of the
   overall length either side of centre and the tyre crown 41.6% of it
   above the ground. Swap the model and they still meet the wheels. */
function rimHook(b, wz){
  var top = BIKE.y + MODEL.len * 0.385;
  b.box(0.035, 0.34, 0.150, -4.452, top + 0.30,  wz - 0.12, C.metal);
  b.box(0.300, 0.062, 0.082, -4.300, top + 0.335, wz - 0.12, C.metal);
  b.box(0.064, 0.300, 0.082, -4.152, top + 0.190, wz - 0.12, 0x2c313a);
  b.box(0.064, 0.058, 0.300, -4.152, top + 0.029, wz + 0.01, 0x2c313a);
  b.box(0.064, 0.170, 0.082, -4.152, top + 0.120, wz + 0.145, 0x2c313a);
  b.box(0.026, 0.058, 0.026, -4.434, top + 0.40,  wz - 0.12, ALLOY);
  b.box(0.026, 0.058, 0.026, -4.434, top + 0.20,  wz - 0.12, ALLOY);
}

/* a road shoe: white synthetic upper, two dials, and a three-bolt cleat
   on the one that fell over, which is the only part that says "road" */
function cycShoe(b, x, sx, sz, ry, tipped){
  var M = tipped ? xf(sx, 0.090, sz, 0, ry, 1.45) : xf(sx, 0, sz, 0, ry, 0);

/* ============================================================
   CAMERA
   State lives in spherical coordinates, not in the camera object,
   so every constraint is enforced before the camera ever moves.
   The camera cannot be put through the floor or behind a wall,
   by a drag or by a framing tween.
   ============================================================ */

var LIM = { thMin: -8*DEG, thMax: 98*DEG, phMin: 22*DEG, phMax: 84*DEG, rMin: 7, rMax: 23 };
var ANIM = !LOW && !REDUCED;

var st   = { t: new THREE.Vector3(0, 1.95, -1.55), r: 13.6, th: 45*DEG, ph: 66*DEG };
var home = { t: new THREE.Vector3(0, 1.95, -1.55), r: 13.6, th: 45*DEG, ph: 66*DEG };

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function applyCam(){
  var sp = Math.sin(st.ph), cp = Math.cos(st.ph);
  camera.position.set(
    st.t.x + st.r * sp * Math.sin(st.th),
    st.t.y + st.r * cp,
    st.t.z + st.r * sp * Math.cos(st.th)
  );
  camera.lookAt(st.t);
}

function homeRadius(){
  var w = canvas.clientWidth || window.innerWidth;
  var h = canvas.clientHeight || window.innerHeight;
  var a = w / (h || 1), r = 13.6;
  if (a < 1) r *= 1 + (1 - a) * 0.90;
  else if (a > 2.2) r *= 0.93;
  return clamp(r, LIM.rMin, LIM.rMax);
}

/* ---- framing a hotspot ---- */
function framing(s){
  var t = s.center.clone(), r = s.r;
  if ((canvas.clientWidth || window.innerWidth) <= 860){
    t.y -= r * 0.17;                       /* bottom sheet: lift the object */
  } else {
    var rx = Math.cos(s.t), rz = -Math.sin(s.t);
    t.x += rx * r * 0.30;                  /* side panel: shift the object left */
    t.z += rz * r * 0.30;
  }
  return { t: t, r: r, th: s.t, ph: clamp(s.p, LIM.phMin, LIM.phMax) };
}

var tw = null, focused = null;
function ease(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
function easeOut(x){ return 1 - Math.pow(1 - x, 3); }

function tweenTo(to, dur, fn, easer){
  if (REDUCED){
    st.t.copy(to.t); st.r = to.r; st.th = to.th; st.ph = to.ph;
    applyCam(); need = true; if (fn) fn();
    return;
  }
  var dth = to.th - st.th;
  while (dth >  Math.PI) dth -= Math.PI*2;
  while (dth < -Math.PI) dth += Math.PI*2;
  tw = {
    f: { t: st.t.clone(), r: st.r, th: st.th, ph: st.ph },
    to: to, dth: dth, t0: 0, dur: dur || 1000, fn: fn || null, e: easer || ease
  };
}

function focus(id, hl){
  var s = (hl && SPOTHL[hl]) || SPOTBY[id];
  if (!s){ UI.open(id, hl); return; }
  focused = s;
  LIM.rMin = 1.1;
  tweenTo(framing(s), 1000);
  UI.open(id, hl || s.hl);
  need = true;
}

function unfocus(){
  if (!focused && !tw) return;
  focused = null;
  home.r = homeRadius();
  tweenTo({ t: home.t.clone(), r: home.r, th: home.th, ph: home.ph }, 900, function(){
    LIM.rMin = 7;
  });
  need = true;
}

UI.setHandlers(function(id, hl){ focus(id, hl); }, function(){ unfocus(); });

/* ============================================================
   INPUT
   Plain mouse and touch events rather than Pointer Events, which
   the older browsers this has to run on do not have.
   ============================================================ */

var drag = false, lx = 0, ly = 0, moved = 0, vth = 0, vph = 0, pinch = 0;

function rotateBy(dx, dy){
  st.th = clamp(st.th - dx * 0.0055, LIM.thMin, LIM.thMax);
  st.ph = clamp(st.ph - dy * 0.0055, LIM.phMin, LIM.phMax);
  need = true;
}
function zoomBy(f){
  st.r = clamp(st.r * f, LIM.rMin, LIM.rMax);
  need = true;
}

function down(x, y){
  drag = true; lx = x; ly = y; moved = 0; vth = vph = 0; tw = null;
  canvas.className = 'dragging';
}
function move(x, y){
  var dx = x - lx, dy = y - ly;
  lx = x; ly = y;
  moved += Math.abs(dx) + Math.abs(dy);
  vth = -dx * 0.0055; vph = -dy * 0.0055;
  rotateBy(dx, dy);
}
function up(){
  if (!drag) return;
  drag = false;
  canvas.className = hover ? 'over' : '';
}

canvas.addEventListener('mousedown', function(e){ e.preventDefault(); down(e.clientX, e.clientY); });
window.addEventListener('mousemove', function(e){
  if (drag) move(e.clientX, e.clientY);
  else { mx = e.clientX; my = e.clientY; wantPick = true; }
});
window.addEventListener('mouseup', function(e){
  var wasDrag = moved > 6;
  up();
  if (!wasDrag && e.target === canvas) pickAt(e.clientX, e.clientY);
});
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomBy(1 + clamp(e.deltaY, -120, 120) * 0.0014);
}, false);

canvas.addEventListener('touchstart', function(e){
  if (e.touches.length === 1){ down(e.touches[0].clientX, e.touches[0].clientY); }
  else if (e.touches.length === 2){
    drag = false;
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  }
}, false);
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  if (e.touches.length === 1 && drag){ move(e.touches[0].clientX, e.touches[0].clientY); }
  else if (e.touches.length === 2){
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) zoomBy(pinch / (d || 1));
    pinch = d;
  }
}, false);
canvas.addEventListener('touchend', function(e){
  var wasDrag = moved > 10;
  var t = e.changedTouches && e.changedTouches[0];
  up(); pinch = 0;
  if (!wasDrag && t) pickAt(t.clientX, t.clientY);
}, false);

/* ============================================================
   PICKING
   ============================================================ */

var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
var hover = null, mx = 0, my = 0, wantPick = false, lastPick = 0;
var tagEl = document.getElementById('tag');
var tagK  = document.getElementById('tagk');
var tagV  = document.getElementById('tagv');

function hitAt(x, y){
  var r = canvas.getBoundingClientRect();
  ndc.x = ((x - r.left) / r.width) * 2 - 1;
  ndc.y = -((y - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  var hits = ray.intersectObjects(PICK, true);
  for (var i = 0; i < hits.length; i++){
    var s = hits[i].object.userData.spot;
    if (s) return s;
  }
  return null;
}

function setHover(s){
  if (hover === s) return;
  hover = s;
  need = true;
  if (!drag) canvas.className = s ? 'over' : '';
  if (s){
    tagK.textContent = s.label;
    tagV.textContent = CONTENT[s.id] ? CONTENT[s.id].title : '';
    tagEl.className = 'on';
  } else {
    tagEl.className = '';
  }
}

function pickAt(x, y){
  var s = hitAt(x, y);
  if (s) focus(s.id, s.hl);
  else if (UI.isOpen()) UI.close();
}

function placeTag(){
  if (!hover) return;
  var v = hover.center.clone().project(camera);
  var r = canvas.getBoundingClientRect();
  tagEl.style.left = (r.left + (v.x * 0.5 + 0.5) * r.width) + 'px';
  tagEl.style.top  = (r.top + (-v.y * 0.5 + 0.5) * r.height) + 'px';
}

/* ============================================================
   RENDER LOOP
   Renders only when something has actually changed. On a machine
   that does not get ambient animation, an untouched room costs
   nothing at all: the loop parks and the GPU goes idle.
   ============================================================ */

var need = true, prev = 0, clock = 0, idleAcc = 0;
var IDLE_STEP = ANIM ? 1 / 30 : 1e9;
var fAcc = 0, fN = 0;

function resize(){
  var w = canvas.clientWidth || window.innerWidth;
  var h = canvas.clientHeight || window.innerHeight;
  renderer.setPixelRatio(scale);
  renderer.setSize(w, h, false);
  camera.aspect = w / (h || 1);
  camera.updateProjectionMatrix();
  home.r = homeRadius();
  if (!focused && !tw) st.r = clamp(st.r, LIM.rMin, LIM.rMax);
  need = true;
}
window.addEventListener('resize', resize);

function materials(t){
  for (var i = 0; i < SPOTS.length; i++){
    var s = SPOTS[i];
    var want = (s === hover || s === focused) ? 1 : 0;
    if (s.lit !== want){
      s.lit += (want - s.lit) * 0.24;
      if (Math.abs(want - s.lit) < 0.01) s.lit = want;
      need = true;
    }
    var k = 1 + 0.58 * s.lit;
    for (var j = 0; j < s.mats.length; j++){
      var e = s.mats[j];
      var kk = (e.fl && ANIM) ? k * (0.94 + 0.06 * Math.sin(t * 5.1 + j * 2.1)) : k;
      e.m.color.copy(e.c).multiplyScalar(kk);
    }
    for (var p = 0; p < s.pulse.length; p++){
      var m = s.pulse[p];
      if (!m.userData.base) m.userData.base = m.color.clone();
      var pk = ANIM ? (0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 2.1 + i * 1.7))) : 0.9;
      m.color.copy(m.userData.base).multiplyScalar(pk * (1 + 0.5 * s.lit));
    }
  }
}

function ambient(t, dt){
  if (dust){
    var P = dust.geometry.attributes.position.array, V = dust.userData.v;
    for (var i = 0; i < V.length; i++){
      P[i*3+1] += V[i] * dt;
      P[i*3]   += Math.sin(t * 0.6 + i) * 0.00035;
      if (P[i*3+1] > 4.30 || P[i*3+1] < 0.02) dust.userData.seed(i);
    }
    dust.geometry.attributes.position.needsUpdate = true;
  }
  bulbGlow.material.opacity = 0.32 + 0.04 * Math.sin(t * 3.7);
}

function loop(now){
  requestAnimationFrame(loop);
  if (!prev) prev = now;
  var dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  clock += dt;

  /* inertia after a flick */
  if (!drag && (Math.abs(vth) > 1e-5 || Math.abs(vph) > 1e-5)){
    st.th = clamp(st.th + vth, LIM.thMin, LIM.thMax);
    st.ph = clamp(st.ph + vph, LIM.phMin, LIM.phMax);
    vth *= 0.90; vph *= 0.90;
    if (Math.abs(vth) < 1e-5) vth = 0;
    if (Math.abs(vph) < 1e-5) vph = 0;
    need = true;
  }

  if (tw){
    if (!tw.t0) tw.t0 = now;
    var k = clamp((now - tw.t0) / tw.dur, 0, 1), e = tw.e(k);
    st.t.lerpVectors(tw.f.t, tw.to.t, e);
    st.r  = tw.f.r  + (tw.to.r - tw.f.r) * e;
    st.ph = tw.f.ph + (tw.to.ph - tw.f.ph) * e;
    st.th = tw.f.th + tw.dth * e;
    need = true;
    if (k >= 1){ var f = tw.fn; tw = null; if (f) f(); }
  }

  if (wantPick && !drag && now - lastPick > 55){
    lastPick = now; wantPick = false;
    setHover(hitAt(mx, my));
  }

  idleAcc += dt;
  var busy = drag || tw || vth || vph;
  if (!need && !busy && idleAcc < IDLE_STEP) return;
  if (idleAcc >= IDLE_STEP) idleAcc = 0;

  materials(clock);
  if (ANIM) ambient(clock, dt);
  applyCam();
  renderer.render(scene, camera);
  placeTag();
  need = false;

  /* adaptive buffer scale: fill rate is what old integrated GPUs run
     out of first, so trade pixels, never geometry or lighting */
  fAcc += dt; fN++;
  if (fN >= 42){
    var ms = (fAcc / fN) * 1000;
    fAcc = 0; fN = 0;
    if (ms > 26 && scale > SCALE_MIN){ scale = Math.max(SCALE_MIN, scale - 0.10); resize(); }
    else if (ms < 12.5 && scale < DPR_CAP){ scale = Math.min(DPR_CAP, scale + 0.06); resize(); }
  }
}

/* ---- go ---- */
resize();
home.r = homeRadius();
st.r = home.r;

if (REDUCED){
  st.th = home.th; st.ph = home.ph;
} else {
  st.r = Math.min(home.r * 1.42, LIM.rMax);
  st.th = 62 * DEG;
  st.ph = 50 * DEG;
  tweenTo({ t: home.t.clone(), r: home.r, th: home.th, ph: home.ph }, 2000, null, easeOut);
}
applyCam();
renderer.render(scene, camera);

var boot = document.getElementById('boot');
setTimeout(function(){ boot.className = 'gone'; }, 140);
requestAnimationFrame(loop);

})();
</script>
